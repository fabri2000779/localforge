<!--
  Favicon — drop the inner highlight stripe and the spark glow at this
  size; they turn to mud at 16×16. Keep only the gradient + L bracket +
  a single hard spark pixel so the silhouette still reads at the tab
  level.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="LocalForge">
  <defs>
    <linearGradient id="f-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#f-bg)"/>

  <path d="M 10 7 L 10 21 Q 10 25 14 25 L 25 25"
        fill="none" stroke="#ffffff" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="26" cy="6" r="2.5" fill="#fde68a"/>
</svg>
