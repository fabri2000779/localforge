[package]
name = "localforge-backend-local"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "NodeBackend implementation backed by a local Docker daemon. Shared by the desktop app and the remote agent."

[dependencies]
localforge-core = { path = "../core" }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
bollard = "0.21"
base64 = "0.22"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
sysinfo = "0.39"
# Backups: archive the server data dir → upload to a bring-your-own
# S3-compatible bucket. rustls (NOT native-tls) so we keep the workspace's
# single TLS stack and pull no OpenSSL. flate2 defaults to the pure-Rust
# miniz_oxide backend → no C toolchain dependency.
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }
tar = "0.4"
flate2 = "1"
# Scheduled actions: parse standard 5-field cron expressions + compute the next
# fire time. Evaluated in the host's local time.
croner = "2"
# Outbound event alerts (crash → Discord/Slack/generic webhook). The host POSTs
# directly; the webhook URL never transits the cloud. rustls-no-provider + a
# preconfigured webpki-roots config matches the rest of the workspace (one TLS
# stack, ring provider, no OpenSSL / aws-lc-rs C toolchain).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "1"
# Local metrics history is stored as plain append-only JSONL (serde_json, below)
# — Docker keeps no history, so the host persists samples itself. Host-side only,
# never synced to the cloud. No DB engine: the data is tiny at one line/min and
# keeping it pure-Rust matches the rest of the crate (no native deps).
