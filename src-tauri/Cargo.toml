[workspace]
members = [".", "core", "backend-local", "backend-remote", "agent", "cloud-client"]
resolver = "2"

[workspace.package]
version = "0.1.50"
authors = ["Fabrizio"]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
futures-util = "0.3"

[package]
name = "localforge"
version.workspace = true
description = "Run game servers locally with a single click"
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "localforge_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
localforge-core = { path = "core" }
localforge-backend-local = { path = "backend-local" }
localforge-backend-remote = { path = "backend-remote" }
# Platform-agnostic LocalForge Cloud client — being extracted from
# src/cloud/* in stages so the desktop and the mobile companion share
# one implementation. Stage 1 (this version) provides api_origin /
# user_agent and the HTTP wrapper (ApiError + get/post). Subsequent
# modules (auth, vault, sync, relay, …) land in follow-up commits.
localforge-cloud-client = { path = "cloud-client" }
toml = "1"
anyhow = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# `shell.open()` was deprecated in favour of tauri-plugin-opener for
# launching files / URLs in the OS default handler — same behaviour,
# narrower API surface.
tauri-plugin-opener = "2"
# Lets us register the `localforge://` URL scheme + receive the deep-link
# from the OS after an OAuth redirect from the cloud API.
tauri-plugin-deep-link = "2"
# Pairs with deep-link on Linux/Windows: a second launch of LocalForge
# (which is what the OS does when handling a localforge:// URL) gets
# intercepted, its CLI args (including the URL) forwarded to the
# already-running instance via IPC, and the second instance exits
# immediately. Without this, each deep-link click spawns a fresh
# process that can never deliver the URL.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# OS-native credential storage (Win Credential Manager, macOS Keychain,
# Linux Secret Service) for the JWT + sync DEK — never localStorage.
#
# We drive this through keyring-core directly and install the right native
# store at runtime in `cloud::keychain::init`. keyring 4.1's own docs are
# explicit that an app which controls its own store should depend on
# keyring-core + the specific per-platform store crates — NOT the `keyring`
# umbrella, whose `use_*_store` installers now sit behind the heavy `cli`
# feature (which drags in sqlite/dbus/etc. we don't want). So we link only the
# native store for each target (see the per-target sections below) and copy the
# tiny install snippet from keyring's `cli` module into `keychain::init`.
#
# The v0.1.14 "silent mock backend → endless re-login" bug stays structurally
# impossible: if `init()` can't install the native store it logs loudly instead
# of silently falling back to a no-op store.
keyring-core = "1"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
bollard = "0.21"
uuid = { workspace = true }
chrono = { workspace = true }
directories = "6"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = { workspace = true }
base64 = "0.22"
rand = "0.9"
# WS client for the cloud relay. rustls so we don't pull OpenSSL.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }

# Per-platform keyring-core native stores. Only the store for the target OS is
# linked; `cloud::keychain::init` sets it as keyring-core's default at startup.
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

# Linux + other *nix (not macOS/iOS/Android): pure-Rust zbus Secret Service
# backend, so the build needs no system libdbus.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
