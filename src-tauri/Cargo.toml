[workspace]
members = [".", "core", "backend-local", "backend-remote", "agent"]
resolver = "2"

[workspace.package]
version = "0.1.17"
authors = ["Fabrizio"]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
futures-util = "0.3"

[package]
name = "localforge"
version.workspace = true
description = "Run game servers locally with a single click"
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "localforge_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
localforge-core = { path = "core" }
localforge-backend-local = { path = "backend-local" }
localforge-backend-remote = { path = "backend-remote" }
toml = "1"
anyhow = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# `shell.open()` was deprecated in favour of tauri-plugin-opener for
# launching files / URLs in the OS default handler — same behaviour,
# narrower API surface.
tauri-plugin-opener = "2"
# Lets us register the `localforge://` URL scheme + receive the deep-link
# from the OS after an OAuth redirect from the cloud API.
tauri-plugin-deep-link = "2"
# Pairs with deep-link on Linux/Windows: a second launch of LocalForge
# (which is what the OS does when handling a localforge:// URL) gets
# intercepted, its CLI args (including the URL) forwarded to the
# already-running instance via IPC, and the second instance exits
# immediately. Without this, each deep-link click spawns a fresh
# process that can never deliver the URL.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# OS-native credential storage (Win Credential Manager, macOS Keychain,
# Linux Secret Service). Used to stash the JWT — never localStorage.
# IMPORTANT: keyring 3.x ships a mock backend by default. Each platform
# needs an explicit feature flag, otherwise save_token() silently
# succeeds and load_token() always returns NoEntry — meaning the user
# appears to log in, the name flashes from /me, then on the next
# render the panel reads the keychain (empty), nulls `me`, and shows
# the sign-in prompt again. Reported by user in v0.1.12 dogfood.
keyring = { version = "3", features = [
  "windows-native",
  "apple-native",
  "sync-secret-service",
  "linux-native-sync-persistent",
] }
# Cloud API client. rustls so we don't depend on the system OpenSSL.
# `rustls-no-provider` matches what the backend-remote crate uses, so
# Cargo dedupes the dependency tree.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
bollard = "0.21"
uuid = { workspace = true }
chrono = { workspace = true }
directories = "6"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = { workspace = true }
lazy_static = "1.5"
futures-util = { workspace = true }
base64 = "0.22"
shell-words = "1.1"
# Client-side AES-256-GCM for cloud-synced server configs. The cloud
# never sees the plaintext — only the encrypted blob + a (server-side
# unknown) random nonce per record.
aes-gcm = "0.10"
rand = "0.9"
# scrypt is the KDF that derives the KEK (Key Encryption Key) from the
# user's password / sync passphrase. Deliberately slow (~150-300ms per
# call) so a stolen DB row can't be brute-forced cheaply. Runs once
# per login on a fresh device, then we cache the unwrapped DEK in the
# OS keychain.
scrypt = { version = "0.11", default-features = false }
# WS client for the cloud relay. rustls so we don't pull OpenSSL.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
# We use this to compute a stable hash of a Server's cloud-relevant
# fields so we can skip re-encrypt+upload when nothing changed.
sha2 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
