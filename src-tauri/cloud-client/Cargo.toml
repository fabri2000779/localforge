[package]
name = "localforge-cloud-client"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared LocalForge Cloud client (HTTP, envelope crypto, relay) for desktop and mobile"

# This crate is the platform-agnostic part of LocalForge's cloud
# integration: HTTP API client, envelope-encryption (DEK/KEK), audit
# producer, sync push/pull, and the WebSocket relay client. Anything
# platform-specific (OS keychain access, Tauri commands, deep-link
# handling) lives in the consuming app — both desktop and mobile
# implement the traits defined here.
#
# Extraction is happening in stages so the desktop never breaks. See
# the commit messages on `serverwave-anywhere` for the migration log.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# HTTP client. rustls-no-provider so we don't pull OpenSSL and so the
# whole workspace dedupes one TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }

# TLS roots. reqwest 0.13's rustls backend DEFAULTS to
# rustls-platform-verifier, which on Android panics ("Expect
# rustls-platform-verifier to be initialized") unless it's handed the
# JNI context at startup + a companion Kotlin component — a brittle
# integration. Instead we hand reqwest a preconfigured rustls config
# that trusts the bundled Mozilla webpki roots, which behaves
# identically on desktop, iOS and Android with zero init. The cloud
# (Cloudflare) chains to a public CA in this bundle. Mirrors the
# sibling backend-remote crate's approach.
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "1"

# Envelope encryption — AES-256-GCM for the wrap + scrypt for the KEK
# derivation. Both pure-Rust and cross-compile to iOS/Android cleanly.
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
rand = "0.9"
base64 = "0.22"

# Asymmetric key sharing for Team orgs: the per-org DEK is sealed to each
# member's X25519 public key (sealed-box style) so the cloud never sees it.
# x25519-dalek + sha2 are pure-Rust and cross-compile to iOS/Android like the
# rest. `static_secrets` exposes StaticSecret (we build keys from OS-random
# bytes ourselves, so no rand_core version coupling).
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
