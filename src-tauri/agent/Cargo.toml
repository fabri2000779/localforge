[package]
name = "localforge-agent"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Remote agent that exposes a NodeBackend over HTTPS for the LocalForge desktop app to drive a VPS or dedicated host."

[[bin]]
name = "localforge-agent"
path = "src/main.rs"

[dependencies]
localforge-core = { path = "../core" }
localforge-backend-local = { path = "../backend-local" }

# HTTP server + TLS
axum = { version = "0.8", features = ["ws", "macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }

# TLS
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.14"

# Relay client (agent → cloud WSS). Same stack as the mobile relay: an
# explicit webpki-roots + ring rustls connector handed to tokio-tungstenite
# via a staged TCP/TLS connect (the default path hung on connect on mobile).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
webpki-roots = "1"
# Decode the one-time enrollment blob from `localforge-agent link <blob>`.
base64 = "0.22"

# Async + serialization
tokio = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# Config + logging
toml = "1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ring = "0.17"
