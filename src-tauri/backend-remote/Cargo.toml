[package]
name = "localforge-backend-remote"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "NodeBackend implementation that drives a remote localforge-agent over HTTPS+WSS with optional cert pinning."

[dependencies]
localforge-core = { path = "../core" }

# HTTP + JSON
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
url = "2"

# WebSocket client
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# TLS
rustls = { version = "0.23", features = ["ring"] }
ring = "0.17"
webpki-roots = "1"

# Async + types
futures-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
