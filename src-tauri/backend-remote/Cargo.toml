[package]
name = "localforge-backend-remote"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "NodeBackend implementation that drives a remote localforge-agent over HTTPS+WSS with optional cert pinning."

[dependencies]
localforge-core = { path = "../core" }

# HTTP + JSON
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json", "stream"] }
url = "2"

# WebSocket client
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# TLS
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
ring = "0.17"
webpki-roots = "1"

# Async + types
tokio = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
bytes = "1"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
