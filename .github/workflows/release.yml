name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v0.1.1). Leave empty to use package.json version.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }} - ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-13
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libappindicator3-dev (legacy) conflicts with libayatana-appindicator3-dev
          # — Tauri 2 only needs ayatana, so we install that one.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Decode Apple API key (.p8) for notarization
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_PATH_BASE64: ${{ secrets.APPLE_API_KEY_PATH_BASE64 }}
        run: |
          if [ -z "${APPLE_API_KEY_PATH_BASE64:-}" ]; then
            echo "::warning::APPLE_API_KEY_PATH_BASE64 not set — skipping notarization."
            exit 0
          fi
          mkdir -p ~/private_keys
          # Strip any CR/LF/whitespace/BOM that PowerShell or copy-paste may
          # have introduced when the secret was set, then decode.
          printf '%s' "$APPLE_API_KEY_PATH_BASE64" \
            | tr -d '\r\n\t ' \
            | sed $'s/^\xEF\xBB\xBF//' \
            | base64 --decode > ~/private_keys/AuthKey.p8
          if [ ! -s ~/private_keys/AuthKey.p8 ]; then
            echo "::error::Decoded AuthKey.p8 is empty — APPLE_API_KEY_PATH_BASE64 looks malformed."
            exit 1
          fi
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # macOS notarization (App Store Connect API key)
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # APPLE_API_KEY_PATH is exported by the previous step (only on macOS)
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'LocalForge ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: |
            See the assets below to download the installer for your platform.

            **Windows:** `.msi` or `.exe` (NSIS)
            **macOS:** `.dmg` (Apple Silicon or Intel)
            **Linux:** `.AppImage` or `.deb`

            ## Remote agent (Linux VPS)

            Install on a server:

            ```bash
            curl -sSL https://github.com/fabri2000779/localforge/releases/download/${{ github.event.inputs.version || github.ref_name }}/install-agent.sh | sudo bash
            ```

            Or grab the binary directly:
              - `localforge-agent-x86_64-unknown-linux-gnu`
              - `localforge-agent-aarch64-unknown-linux-gnu`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  agent:
    name: Build agent (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: true

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: agent-${{ matrix.target }}

      - name: Build agent
        working-directory: ./src-tauri
        # -p selects the agent package within the workspace; the workspace
        # root crate has no `localforge-agent` bin target so plain --bin
        # fails with "no bin target named ... in default-run packages".
        run: cargo build --release -p localforge-agent --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          mv src-tauri/target/${{ matrix.target }}/release/localforge-agent \
             localforge-agent-${{ matrix.target }}

      - name: Upload agent binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          draft: true
          files: |
            localforge-agent-${{ matrix.target }}
            scripts/install-agent.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
