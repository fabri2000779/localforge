name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v0.1.1). Leave empty to use package.json version.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }} - ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal macOS: one tauri build on the Apple Silicon runner
          # cross-compiles to both arm64 + x86_64 and produces a fat .dmg.
          # We do this instead of a separate macos-13 (Intel) job because
          # macos-13 runners are scarce and routinely queue indefinitely.
          - platform: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            # `app` is required by the updater (it's the .app.tar.gz
            # payload the installed app downloads to patch itself);
            # `dmg` is for first-time installs.
            args: '--target universal-apple-darwin --bundles app,dmg'
            updater_glob: 'src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*'
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            # appimage produces both .AppImage (installer) and
            # .AppImage.tar.gz (updater); deb + rpm cover distro
            # package managers.
            args: '--bundles deb,appimage,rpm'
            updater_glob: 'src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz*'
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            # nsis produces both .exe (installer) and .nsis.zip (updater).
            args: '--bundles nsis'
            updater_glob: 'src-tauri/target/release/bundle/nsis/*.nsis.zip*'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libappindicator3-dev (legacy) conflicts with libayatana-appindicator3-dev
          # — Tauri 2 only needs ayatana, so we install that one.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal mac needs both arches; everyone else gets the
          # single rust triple from the matrix.
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Sanitise Apple signing secrets (macOS only)
        # Secrets uploaded via `gh secret set` from PowerShell can ship
        # with a UTF-8 BOM (EF BB BF) and/or trailing CR/LF that
        # tauri-action's base64 decoder rejects with
        # "Invalid symbol 239, offset 0". We re-export each one with
        # those stripped so the build step gets clean values.
        if: runner.os == 'macOS'
        env:
          RAW_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          RAW_CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          RAW_IDENT: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          RAW_KEYCHAIN: ${{ secrets.KEYCHAIN_PASSWORD }}
          RAW_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          RAW_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          RAW_KEY_P8: ${{ secrets.APPLE_API_KEY_PATH_BASE64 }}
        run: |
          sanitise() {
            # Strip leading UTF-8 BOM, any CR/LF, and surrounding spaces.
            printf '%s' "$1" \
              | sed $'s/^\xEF\xBB\xBF//' \
              | tr -d '\r\n' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }
          {
            echo "APPLE_CERTIFICATE=$(sanitise "$RAW_CERT")"
            echo "APPLE_CERTIFICATE_PASSWORD=$(sanitise "$RAW_CERT_PASS")"
            echo "APPLE_SIGNING_IDENTITY=$(sanitise "$RAW_IDENT")"
            echo "KEYCHAIN_PASSWORD=$(sanitise "$RAW_KEYCHAIN")"
            echo "APPLE_API_ISSUER=$(sanitise "$RAW_ISSUER")"
            echo "APPLE_API_KEY=$(sanitise "$RAW_KEY_ID")"
          } >> "$GITHUB_ENV"

          # Decode the App Store Connect .p8 file to disk for notarytool.
          if [ -z "${RAW_KEY_P8:-}" ]; then
            echo "::warning::APPLE_API_KEY_PATH_BASE64 not set — skipping notarization."
            exit 0
          fi
          mkdir -p ~/private_keys
          printf '%s' "$RAW_KEY_P8" \
            | sed $'s/^\xEF\xBB\xBF//' \
            | tr -d '\r\n\t ' \
            | base64 --decode > ~/private_keys/AuthKey.p8
          if [ ! -s ~/private_keys/AuthKey.p8 ]; then
            echo "::error::Decoded AuthKey.p8 is empty — APPLE_API_KEY_PATH_BASE64 looks malformed."
            exit 1
          fi
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing/notarization env vars are exported (cleaned of
          # BOM/CRLF) by the previous step; tauri-action picks them up
          # from the process env automatically.
          # Tauri updater signing — tauri-action signs each bundle into a
          # .sig file and generates latest.json automatically when these
          # are present.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'LocalForge ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: |
            See the assets below to download the installer for your platform.

            ## Desktop
            **Windows:** `.exe` (NSIS installer)
            **macOS:** universal `.dmg` (Apple Silicon + Intel in one file)
            **Linux:** `.deb` (Debian/Ubuntu), `.rpm` (RHEL/Fedora) or `.AppImage` (everywhere)

            ## Remote agent

            ### Linux (one-liner)

            ```bash
            curl -sSL https://github.com/fabri2000779/localforge/releases/download/${{ github.event.inputs.version || github.ref_name }}/install-agent.sh | sudo bash
            ```

            ### Windows / Windows Server (one-liner)

            In an **elevated** PowerShell:

            ```powershell
            iex "& { $(irm https://github.com/fabri2000779/localforge/releases/download/${{ github.event.inputs.version || github.ref_name }}/install-agent.ps1) }"
            ```

            The script downloads the binary to `C:\Program Files\LocalForge`,
            writes its config to `C:\ProgramData\LocalForge\config\agent.toml`
            (with ACLs locked to SYSTEM + Administrators), generates a
            self-signed TLS cert + bearer token, and registers the agent
            as a scheduled task that auto-starts at boot under
            `NT AUTHORITY\SYSTEM`. Pass `-InstallAsService` to register
            via `sc.exe` instead (wrap with NSSM for full SCM support).

            Requires Docker Desktop or Docker Engine for Windows already
            installed.

            ### Direct binary download

              - `localforge-agent-x86_64-unknown-linux-gnu`
              - `localforge-agent-aarch64-unknown-linux-gnu`
              - `localforge-agent-x86_64-pc-windows-msvc.exe`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload updater bundle + signature
        # tauri-action only uploads the "installer" bundles per --bundles
        # flag; the .tar.gz/.zip updater payloads and their .sig companions
        # get dropped on the floor. Pick them up here and attach to the
        # draft so the consolidation job can build latest.json from them.
        #
        # We use `gh release upload` (in bash, including on Windows via
        # git-bash) instead of softprops/action-gh-release@v2 because the
        # latter silently fails to expand globs like `*.tar.gz*` even
        # though the files exist on disk.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
          GLOB: ${{ matrix.updater_glob }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Resolve the glob via the shell so multi-segment patterns work.
          # shellcheck disable=SC2206 — intentional word splitting.
          files=( $GLOB )

          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No files matched glob: $GLOB"
            echo "Listing bundle parent dir for debugging:"
            ls -la "$(dirname "$GLOB")" || true
            exit 1
          fi

          echo "Found ${#files[@]} files to upload:"
          printf '  - %s\n' "${files[@]}"

          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  agent:
    name: Build agent (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: false
            ext: ''
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: true
            ext: ''
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
            ext: '.exe'

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchain (Linux arm64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: agent-${{ matrix.target }}

      - name: Build agent
        working-directory: ./src-tauri
        # -p selects the agent package within the workspace; the workspace
        # root crate has no `localforge-agent` bin target so plain --bin
        # fails with "no bin target named ... in default-run packages".
        run: cargo build --release -p localforge-agent --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mv src-tauri/target/${{ matrix.target }}/release/localforge-agent \
             localforge-agent-${{ matrix.target }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item `
            "src-tauri/target/${{ matrix.target }}/release/localforge-agent.exe" `
            "localforge-agent-${{ matrix.target }}.exe"

      - name: Upload agent binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          draft: true
          files: |
            localforge-agent-${{ matrix.target }}${{ matrix.ext }}
            scripts/install-agent.sh
            scripts/install-agent.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Compose latest.json once every desktop matrix job has uploaded its
  # signed updater bundle. The plugin-updater on installed clients
  # polls this file to discover new versions.
  # ---------------------------------------------------------------------------
  updater-manifest:
    name: Generate updater manifest
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - name: Compose latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # Pull every .sig file the build matrix uploaded. `gh release
          # download` exits non-zero when nothing matches, which would
          # abort the whole script — we want to keep going and emit a
          # warning instead so the failure is visible in the logs.
          mkdir -p sigs
          if ! gh release download "$TAG" --repo "$REPO" --pattern '*.sig' --dir sigs 2>&1; then
            echo "::warning::no .sig files matched on release $TAG — latest.json will be empty"
          fi
          echo "Downloaded signatures:"
          ls -la sigs || true

          # Helper: find the first file in sigs/ matching a glob.
          pick() {
            local pattern="$1"
            for f in sigs/$pattern; do
              if [ -f "$f" ]; then
                echo "$f"
                return 0
              fi
            done
            return 1
          }

          # Each platform's updater payload + signature.
          MAC_SIG=$(pick '*.app.tar.gz.sig' || true)
          LINUX_SIG=$(pick '*.AppImage.tar.gz.sig' || pick '*.AppImage.sig' || true)
          WIN_SIG=$(pick '*.nsis.zip.sig' || pick '*-setup.exe.sig' || true)

          # Discover the matching bundle URLs by listing release assets.
          assets_json=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets')

          find_url() {
            local pattern="$1"
            echo "$assets_json" | jq -r ".[] | select(.name | test(\"$pattern\")) | .url" | head -n1
          }

          MAC_URL=$(find_url '\\.app\\.tar\\.gz$' || true)
          LINUX_URL=$(find_url '\\.AppImage\\.tar\\.gz$' || true)
          WIN_URL=$(find_url '\\.nsis\\.zip$' || true)

          read_sig() { [ -n "$1" ] && [ -f "$1" ] && cat "$1" || echo ""; }

          MAC_SIG_CONTENT=$(read_sig "$MAC_SIG")
          LINUX_SIG_CONTENT=$(read_sig "$LINUX_SIG")
          WIN_SIG_CONTENT=$(read_sig "$WIN_SIG")

          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOTES="See release notes at https://github.com/${REPO}/releases/tag/${TAG}"

          # Build platforms object dynamically to skip missing entries.
          platforms="{}"
          add_platform() {
            local key="$1" sig="$2" url="$3"
            if [ -n "$sig" ] && [ -n "$url" ]; then
              platforms=$(jq -c \
                --arg k "$key" --arg s "$sig" --arg u "$url" \
                '. + {($k): {signature: $s, url: $u}}' <<<"$platforms")
            else
              echo "::warning::missing sig or url for $key (sig=${sig:+yes}/no, url=${url:+yes}/no)"
            fi
          }
          add_platform "darwin-x86_64"    "$MAC_SIG_CONTENT"   "$MAC_URL"
          add_platform "darwin-aarch64"   "$MAC_SIG_CONTENT"   "$MAC_URL"
          add_platform "linux-x86_64"     "$LINUX_SIG_CONTENT" "$LINUX_URL"
          add_platform "windows-x86_64"   "$WIN_SIG_CONTENT"   "$WIN_URL"

          jq -n \
            --arg v "$VERSION" \
            --arg n "$NOTES" \
            --arg d "$PUB_DATE" \
            --argjson p "$platforms" \
            '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > latest.json

          echo "--- latest.json ---"
          cat latest.json

      - name: Upload latest.json
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          draft: true
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
